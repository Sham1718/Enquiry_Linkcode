name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/frontend_ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/frontend_ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build