name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "inquiry-management/**"
      - ".github/workflows/backend_ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "inquiry-management/**"
      - ".github/workflows/backend_ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: inquiry-management

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build backend
        run: ./mvnw clean package -DskipTests