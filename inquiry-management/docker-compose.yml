services:
  mysql:
    image: mysql:8.0
    container_name: inquiry_name
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: INQUIRY


    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
      build: .
      container_name: inquiry_backend
      restart: unless-stopped

      ports:
        - "8080:8080"

      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/INQUIRY?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root123

      depends_on:
        mysql:
          condition: service_healthy


volumes:
  mysql_data: